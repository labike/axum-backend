[package]
name = "axum-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.0"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-async-std", "tls-native-tls", "postgres", "uuid", "chrono", "macros", "migrate"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
validator = { version = "0.21.0", features = ["derive"] }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
time = "0.3.55"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing-subscriber = { version = "0.3.23" }
lettre = "0.11.23"